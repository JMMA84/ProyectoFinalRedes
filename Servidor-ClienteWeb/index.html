<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control remoto</title>
<style>
  :root { --bg:#eef1f5; --panel:#fff; --ink:#1c2430; --muted:#5d6877; --line:#cfd6df; --accent:#1f5fbf;
    --ok:#1d7a4a; --err:#b3261e; --warn:#9a5b00; --in:#f1f3f6; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151a21; --panel:#1d242d; --ink:#e6ebf2; --muted:#9aa5b4;
    --line:#323c49; --accent:#6aa5ff; --ok:#5fcf92; --err:#ff8a80; --warn:#ffc266; --in:#262e39; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
  h1 { font-size:1.5rem; margin:0; } h2 { font-size:1rem; margin:0 0 12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  button { font:inherit; padding:9px 14px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--panel); color:var(--ink); border-color:var(--line); }
  button:disabled, input:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .status { display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--err); flex:none; }
  .dot.on { background:var(--ok); }
  .muted { color:var(--muted); font-size:.875rem; }
  #sliderRow { display:flex; align-items:center; gap:12px; margin:14px 0 6px; }
  #level { flex:1; accent-color:var(--accent); }
  #levelOut { min-width:3.2ch; text-align:right; font-variant-numeric:tabular-nums; }
  #feedback { min-height:1.5em; margin-top:10px; font-weight:600; }
  #feedback.ok { color:var(--ok); } #feedback.error { color:var(--err); }
  #log { height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; font:.85rem/1.4 ui-monospace,Menlo,Consolas,monospace; }
  .line { padding:4px 8px; border-radius:4px; background:var(--in); }
  .line.ok { color:var(--ok); } .line.error { color:var(--err); } .line.motion { color:var(--warn); font-weight:700; }
  .time { color:var(--muted); margin-right:8px; font-weight:400; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Control remoto</h1>
    <button class="secondary" id="logout">Cerrar sesión</button>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Estado">
      <h2>Estado</h2>
      <div class="status"><span class="dot" id="devDot"></span><span id="devText">Raspberry desconectada</span></div>
      <p class="muted" style="margin:8px 0 0" id="lightText">Luz: sin información</p>
      <p class="muted" style="margin:4px 0 0" id="connText">Panel: conectando…</p>
    </section>
    <section class="panel" aria-label="Alertas">
      <h2>Alerta de movimiento</h2>
      <p class="muted" style="margin:0 0 12px">Cuando el sensor detecta movimiento se envía un correo y aparece en el registro.</p>
      <button class="secondary" id="testMail">Enviar correo de prueba</button>
    </section>
  </div>

  <section class="panel" aria-label="Iluminación">
    <h2>Iluminación</h2>
    <div class="row">
      <button id="btnOn" disabled>Encender</button>
      <button id="btnOff" class="secondary" disabled>Apagar</button>
    </div>
    <div id="sliderRow">
      <label for="level" class="muted">Intensidad</label>
      <input id="level" type="range" min="0" max="100" value="100" disabled>
      <output id="levelOut" for="level">100%</output>
    </div>
    <p class="muted" style="margin:0">Al soltar el control, la luz se enciende con esa intensidad.</p>
    <div id="feedback" role="status" aria-live="polite"></div>
  </section>

  <section class="panel" aria-label="Registro">
    <div class="row" style="justify-content:space-between; margin-bottom:12px">
      <h2 style="margin:0">Registro de actividad</h2>
      <button class="secondary" id="clear">Limpiar vista</button>
    </div>
    <div id="log" aria-live="polite"></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  let ws, online = false, busy = false, busyTimer;

  function controls() { ['btnOn', 'btnOff', 'level'].forEach(id => $(id).disabled = !online || busy); }
  function setBusy(v) { busy = v; clearTimeout(busyTimer); if (v) busyTimer = setTimeout(() => setBusy(false), 9000); controls(); }

  function addLog(ev) {
    const d = document.createElement('div');
    d.className = 'line ' + ev.kind;
    const t = document.createElement('span');
    t.className = 'time'; t.textContent = new Date(ev.ts * 1000).toLocaleTimeString();
    d.append(t, ev.text);
    const log = $('log'); log.append(d);
    while (log.children.length > 200) log.firstChild.remove();
    log.scrollTop = log.scrollHeight;
  }

  function renderState(s) {
    online = s.online;
    $('devDot').className = 'dot' + (online ? ' on' : '');
    $('devText').textContent = online ? `Raspberry en línea (${s.name})` : 'Raspberry desconectada';
    const l = s.light;
    $('lightText').textContent = 'Luz: ' + (l.state === 'on' ? `encendida al ${l.level}%` : l.state === 'off' ? 'apagada' : 'sin información');
    $('level').value = l.level; $('levelOut').textContent = l.level + '%';
    setBusy(false);
  }

  function sendLight(state) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    $('feedback').className = ''; $('feedback').textContent = 'Enviando…';
    setBusy(true);
    ws.send(JSON.stringify({ type: 'light', state, level: +$('level').value }));
  }

  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/panel`);
    ws.onopen = () => $('connText').textContent = 'Panel: conectado';
    ws.onclose = async () => {
      $('connText').textContent = 'Panel: reconectando…';
      online = false; controls();
      try { const r = await fetch('/api/me'); if (r.status === 401) { location.href = '/login'; return; } } catch {}
      setTimeout(connect, 2000);
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'snapshot') { $('log').replaceChildren(); m.history.forEach(addLog); renderState(m.state); }
      else if (m.type === 'state') renderState(m);
      else if (m.type === 'log') addLog(m);
      else if (m.type === 'result') {
        $('feedback').className = m.ok ? 'ok' : 'error';
        $('feedback').textContent = (m.ok ? '✔ ' : '✖ ') + m.text;
        setBusy(false);
      }
    };
  }

  $('btnOn').onclick = () => sendLight('on');
  $('btnOff').onclick = () => sendLight('off');
  $('level').oninput = e => $('levelOut').textContent = e.target.value + '%';
  $('level').onchange = () => sendLight('on');
  $('testMail').onclick = () => ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ type: 'test_mail' }));
  $('clear').onclick = () => $('log').replaceChildren();
  $('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };
  connect();
</script>
</body>
</html>
