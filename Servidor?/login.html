<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Control remoto</title>
<style>
  :root { --bg:#eef1f5; --panel:#fff; --ink:#1c2430; --muted:#5d6877; --line:#cfd6df; --accent:#1f5fbf; --err:#b3261e; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151a21; --panel:#1d242d; --ink:#e6ebf2; --muted:#9aa5b4; --line:#323c49; --accent:#6aa5ff; --err:#ff8a80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:1.4rem; margin:0; } p { margin:0; color:var(--muted); }
  label { display:flex; flex-direction:column; gap:4px; font-size:.875rem; color:var(--muted); }
  input, button { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #error { color:var(--err); font-size:.9rem; min-height:1.3em; }
</style>
</head>
<body>
<form id="f">
  <h1>Control remoto</h1>
  <p>Inicia sesión para continuar.</p>
  <label>Usuario <input id="user" autocomplete="username" required autofocus></label>
  <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
  <div id="error" role="alert"></div>
  <button id="go">Iniciar sesión</button>
</form>
<script>
  const $ = id => document.getElementById(id);
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('go').disabled = true; $('error').textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: $('user').value, password: $('password').value }) });
      if (r.ok) { location.href = '/'; return; }
      $('error').textContent = (await r.json()).error || 'No se pudo iniciar sesión';
    } catch { $('error').textContent = 'No se pudo conectar con el servidor'; }
    $('go').disabled = false;
  });
</script>
</body>
</html>
